<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>手写代码</title>
  </head>
  <body>
    <script>
      // 手写浅拷贝
      function copy(obj) {
        if (!obj || typeof obj !== "object") return;
        let newObj = Array.isArray(obj) ? [] : {};
        for (let key in obj) {
          if (obj.hasOwnProperty(key)) {
            newObj[key] = obj[key];
          }
        }
        return newObj;
      }
      // 手写深拷贝 多一条判断 递归
      function deepCopy(obj) {
        if (!obj || typeof obj !== "object") return;
        let newObj = Array.isArray(obj) ? [] : {};
        for (let key in obj) {
          if (obj.hasOwnProperty(key)) {
            newObj[key] =
              typeof key === "object" ? deepCopy(obj[key]) : obj[key];
          }
        }
        return newObj;
      }
      // 防抖 存在则清除
      function debounce(fn, delay) {
        let timer = null;
        return (...args) => {
          if (timer) clearTimeout(timer);
          timer = setTimeout(() => {
            fn.apply(this, args);
          }, delay);
        };
      }

      // 节流 不存在才继续 执行完重新计时
      function throttle(fn, delay) {
        let timer = null;
        return (...args) => {
          if (!timer) {
            timer = setTimeout(() => {
              fn.apply(this, args);
              timer = null;
            }, delay);
          }
        };
      }
      console.log("-----------");
      function clone(obj) {
        if (!obj || typeof obj !== "object") return;
        let newObj = Array.isArray(obj) ? [] : {};
        for (let key in obj) {
          newObj[key] = obj[key];
        }
      }
      function deepClone(obj) {
        if (!obj || typeof obj !== "object") return;
        let newObj = Array.isArray(obj) ? [] : {};
        for (let key in obj) {
          newObj[key] = typeof key === "object" ? deepClone(key) : obj[key];
        }
      }
      console.log("-----------");
      // 数组去重
      const repeatArr = [1, 3, 1, 4, 2, 5, 3, 6];
      const singleArr = Array.from(new Set(repeatArr));
      // 一个栗子：闭包 加减乘除
      function counter(value) {
        let pre = value;
        return {
          inc: (v) => {
            return pre + v;
          },
          dec: (v) => {
            return pre - v;
          },
          multiply: (v) => {
            return pre * v;
          },
          divide: (v) => {
            return pre / v;
          },
          value: pre,
        };
      }
      console.log("dec", counter(1).multiply(2));
      console.log("inc", counter(1).divide(10));
      console.log("value", counter(1).value);
      // 链式调用 闭包
      function counter2(num) {
        let res = num;
        return {
          add: (v) => {
            res = res + v;
            return counter2(res);
          },
          sub: (v) => {
            res = res - v;
            return counter2(res);
          },
          multiply: (v) => {
            res = res * v;
            return counter2(res);
          },
          div: (v) => {
            res = res / v;
            return counter2(res);
          },
          value: res,
        };
      }
      console.log("利用闭包链式调用", counter2(5).add(2).sub(10).value);

      // 比较版本
      function versionSort(item1, item2) {
        let arr1 = item1.split(".");
        let arr2 = item2.split(".");
        let maxLength = Math.max(arr1.length, arr2.length);
        for (let i = 0; i < maxLength; i++) {
          let v1 = parseInt(arr1[i]) || 0;
          let v2 = parseInt(arr2[i]) || 0;
          if (v1 < v2) {
            return -1;
          } else if (v1 > v2) {
            return 1;
          }
        }
        return 0;
      }
      let versionArr = ["1.3", "1.1.2", "1.2.1", "1.1", "1.1.1"];
      console.log("比较版本大小：", versionArr.sort(versionSort));
      // 将sort设置为默认的稳定排序
      let arr = ["table", "see", "apple", "stop", "See"];
      const fn = (a, b) => {
        if (a[0] < b[0]) return -1;
        return 1;
      };
      console.log("sort排序", arr.sort(fn)); // ['apple', 'see', 'stop', 'table']
      // 递归平铺数组
      function flatArr(arr) {
        let res = [];
        arr.forEach((element) => {
          if (Array.isArray(element)) {
            res.push(...flatArr(element));
          } else {
            res.push(element);
          }
        });
        return res;
      }
      console.log("递归平铺数组", flatArr([1, 5, [2, 4, [3, 6]]]));
    </script>
  </body>
